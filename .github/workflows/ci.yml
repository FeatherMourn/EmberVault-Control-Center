name: EmberVault Control Center CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install .

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test*.py" -v 2>&1 | tee test-output.log

      - name: Upload Linux test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-diagnostics
          path: test-output.log

      - name: Compile Python packages
        run: python -m compileall -q core control_center tools

      - name: Validate QML shell assets
        run: >-
          python -c "from pathlib import Path; p=Path('ui/Main.qml'); text=p.read_text(encoding='utf-8');
          assert p.is_file() and 'component HomePage' in text and 'component ActivityPage' in text and
          'controlCenter.dashboardHealth' in text; print('QML shell assets validated')"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-cache-dir --wheel-dir dist

      - name: Verify release assets
        shell: bash
        run: python tools/verify_release.py "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Verify catalog handoff
        run: |
          python tools/sync_catalog.py "$RUNNER_TEMP/embervault-catalog"
          python tools/verify_catalog.py "$RUNNER_TEMP/embervault-catalog/embervault-catalog.json"

      - name: Validate installed wheel assets
        shell: bash
        run: |
          python -m venv .ci-wheel-venv
          .ci-wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.ci-wheel-venv/bin/python" -c "from pathlib import Path; from control_center.app import _ui_path; p=_ui_path(); assert p.is_file() and (p.parents[1] / 'knowledge' / 'entries.json').is_file(); print('Installed wheel assets validated:', p)"

      - name: Upload verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: embervault-control-center-wheel
          path: dist/*.whl

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install .

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Compile Python packages
        run: python -m compileall -q core control_center tools

      - name: Smoke-test QML shell
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m control_center.app --smoke-test

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-cache-dir --wheel-dir dist

      - name: Verify release assets
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python tools/verify_release.py $wheel.FullName

      - name: Smoke-test installed wheel
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv .ci-wheel-venv
          $python = (Resolve-Path .ci-wheel-venv\Scripts\python.exe).Path
          $wheel = (Get-ChildItem dist -Filter *.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          & $python -m pip install $wheel
          Set-Location $env:TEMP
          & $python -m control_center.app --smoke-test

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and signing dependencies
        run: python -m pip install . cryptography nuitka

      - name: Build Windows standalone package
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64
          python tools\build_windows_nuitka.py "%TEMP%\EmberVaultControlCenter-release-build" --console

      - name: Materialize signing key outside workspace
        shell: pwsh
        env:
          RELEASE_PRIVATE_KEY_B64: ${{ secrets.EMBERVAULT_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PRIVATE_KEY_B64)) { throw "Release signing secret is not configured." }
          $key = Join-Path $env:RUNNER_TEMP "embervault-release-key.pem"
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:RELEASE_PRIVATE_KEY_B64))

      - name: Create signed release bundle
        shell: pwsh
        env:
          RELEASE_KEY_ID: ${{ secrets.EMBERVAULT_RELEASE_KEY_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_KEY_ID)) { throw "Release key ID is not configured." }
          $version = (Get-Content pyproject.toml | Select-String '^version = ' | ForEach-Object { $_.ToString().Split('"')[1] })
          $artifact = Join-Path $env:TEMP "EmberVaultControlCenter-release-build\windows_entry.dist\EmberVaultControlCenter.exe"
          python -m tools.package_signed_release $artifact $version (Join-Path $env:RUNNER_TEMP "embervault-release-key.pem") $env:RELEASE_KEY_ID "$env:GITHUB_WORKSPACE\signed-release"
          if (-not (Test-Path signed-release\release.json)) { throw "Signed release manifest was not created." }

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: embervault-control-center-signed-release
          path: signed-release/*
