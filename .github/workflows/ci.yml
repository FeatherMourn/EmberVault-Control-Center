name: EmberVault Control Center CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install .

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Compile Python packages
        run: python -m compileall -q core control_center tools

      - name: Smoke-test QML shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m control_center.app --smoke-test

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-cache-dir --wheel-dir dist

      - name: Verify release assets
        shell: bash
        run: python tools/verify_release.py "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Verify catalog handoff
        run: |
          python tools/sync_catalog.py "$RUNNER_TEMP/embervault-catalog"
          python tools/verify_catalog.py "$RUNNER_TEMP/embervault-catalog/embervault-catalog.json"

      - name: Smoke-test installed wheel
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv .ci-wheel-venv
          .ci-wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.ci-wheel-venv/bin/python" -m control_center.app --smoke-test

      - name: Upload verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: embervault-control-center-wheel
          path: dist/*.whl

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install .

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Compile Python packages
        run: python -m compileall -q core control_center tools

      - name: Smoke-test QML shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m control_center.app --smoke-test

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-cache-dir --wheel-dir dist

      - name: Verify release assets
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python tools/verify_release.py $wheel.FullName

      - name: Smoke-test installed wheel
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv .ci-wheel-venv
          $python = (Resolve-Path .ci-wheel-venv\Scripts\python.exe).Path
          $wheel = (Get-ChildItem dist -Filter *.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          & $python -m pip install $wheel
          Set-Location $env:TEMP
          & $python -m control_center.app --smoke-test
