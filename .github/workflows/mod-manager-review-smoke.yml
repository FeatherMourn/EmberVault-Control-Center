name: Mod Manager Review Smoke

on:
  push:
  pull_request:

jobs:
  review-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify read-only Mod Manager display boundary
        run: python -m unittest tests.test_modules.ModuleRegistryTests.test_mod_manager_review_display_is_read_only_and_has_no_actions
