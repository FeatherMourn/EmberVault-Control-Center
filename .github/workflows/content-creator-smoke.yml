name: Content Creator Smoke

on:
  push:
  pull_request:

jobs:
  standalone-content-creator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Control Center
        run: python -m pip install .
      - name: Launch Content Creator offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/content_creator_entry.py --profile=default --smoke-test
