[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embervault-control-center"
version = "1.0.0rc1"
description = "Modular Enshrouded Control Center"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "cryptography>=43",
  "embervault-module-sdk @ git+https://github.com/FeatherMourn/EmberVault-Module-SDK.git"
]

[project.scripts]
embervault = "control_center.app:main"

[tool.setuptools.packages.find]
include = ["core*", "control_center*"]

[tool.setuptools.data-files]
"ui" = ["ui/Main.qml"]
"contracts" = ["contracts/module-manifest.schema.json", "contracts/package-manifest.schema.json", "contracts/catalog.schema.json", "contracts/worker-result.schema.json", "contracts/evidence-reference.schema.json", "contracts/recovery-reference.schema.json", "contracts/game-settings.schema.json", "contracts/tuning-adapter.schema.json", "contracts/character-plan.schema.json", "contracts/content-project.schema.json", "contracts/knowledge-entry.schema.json", "contracts/research-summary.schema.json", "contracts/trainer-plan.schema.json", "contracts/integration-context.schema.json", "contracts/promotion-evidence.schema.json"]
"knowledge" = ["knowledge/entries.json"]
"modules/example" = ["modules/example/module.json", "modules/example/module.py"]
"modules/trainer" = ["modules/trainer/module.json", "modules/trainer/trainer_stub.py"]
"modules/research" = ["modules/research/module.json", "modules/research/research_stub.py"]
"modules/content-creator" = ["modules/content-creator/module.json", "modules/content-creator/content_stub.py"]
"modules/save-manager" = ["modules/save-manager/module.json", "modules/save-manager/module.py"]
"modules/mod-manager" = ["modules/mod-manager/module.json", "modules/mod-manager/module.py"]
"modules/character-tools" = ["modules/character-tools/module.json", "modules/character-tools/module.py"]
"modules/troubleshooter" = ["modules/troubleshooter/module.json", "modules/troubleshooter/module.py"]
"modules/tuning-audit" = ["modules/tuning-audit/module.json", "modules/tuning-audit/tuning_stub.py"]
"adapters" = ["adapters/eml-balancing-table.json"]
"packages/example-mod" = ["packages/example-mod/package.json"]
"packages/eml-tuning-adapter" = ["packages/eml-tuning-adapter/package.json", "packages/eml-tuning-adapter/mod.json", "packages/eml-tuning-adapter/mod.lua"]
"templates/module" = ["templates/module/module.json", "templates/module/module.py", "templates/module/README.md"]
